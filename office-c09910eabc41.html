<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>小熊工作室</title>
<link rel="icon" type="image/png" href="/icon-192.png">
<style>
:root{--bg:#fbf6f0;--paper:#fffdf9;--ink:#554943;--muted:#9a8980;--line:#eee3da;--rose:#bd8582;--rose2:#a66f72;--sage:#728369;--sageb:#edf2e9;--warn:#a2660f;--warnb:#fbe9cc;--bad:#b23b40;--badb:#fde2e1;--blue:#4f6f97;--blueb:#eef3f9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0}
.wrap{max-width:1100px;margin:auto;padding:18px max(16px,env(safe-area-inset-left,0px)) 60px max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;gap:12px;margin-bottom:14px}header img{width:42px;height:42px;border-radius:12px}header h1{font-size:19px;margin:0}header small{display:block;color:var(--muted);font-size:11px}header .sp{flex:1}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}.tabs button{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:8px 14px;white-space:nowrap;color:#8d786d}.tabs button.on{background:#695650;border-color:#695650;color:#fff}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px}.stat small{color:var(--muted);font-size:11px}.stat b{display:block;font-size:24px;margin-top:4px;color:#5d4b44}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:720px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap}
.tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}.t-active{background:var(--sageb);color:var(--sage)}.t-trial{background:var(--warnb);color:var(--warn)}.t-ro{background:var(--badb);color:var(--bad)}.t-none{background:#f1e4dc;color:#8d786d}.t-admin{background:var(--blueb);color:var(--blue)}
.btn{background:var(--rose);color:#fff;border-radius:10px;padding:8px 12px;font-weight:700}.btn.o{background:var(--paper);color:var(--rose2);border:1px solid #e3c4c0}.btn.s{padding:5px 9px;font-size:12px}.btn:disabled{opacity:.5}
.acts{display:flex;flex-wrap:wrap;gap:5px}
input,select,textarea{border:1px solid #eadbd1;border-radius:10px;background:#fffdf9;padding:8px 10px;width:100%;min-width:0}textarea{min-height:80px;line-height:1.6}
label.f{display:grid;gap:4px;font-size:12px;color:#8d786d}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:10px}
.muted{color:var(--muted);font-size:12px}.search{margin-bottom:10px}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 10px;margin:6px 0 10px}.feat label{display:flex;gap:6px;align-items:center;font-size:12.5px}.feat input{width:auto}
dialog{border:0;border-radius:18px;padding:0;max-width:min(520px,calc(100vw - 24px));width:100%;background:var(--paper);color:var(--ink);box-shadow:0 20px 60px #49372d40}dialog::backdrop{background:#3b2e2866}.dlg{padding:16px}.dlg h3{margin:0 0 10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#61524b;color:#fff;border-radius:14px;padding:10px 16px;font-size:13px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)}.toast.on{opacity:1}
.empty{padding:30px;text-align:center;color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<header id="head" hidden><img src="/icon-192.png" alt=""><div><h1>小熊工作室後台</h1><small>只顯示帳號、方案、用量與付款，不顯示任何學生資料</small></div><span class="sp"></span><button class="btn o s" id="logout">登出後台</button></header>
<div id="gate" class="card empty">載入中…</div>
<div id="app" hidden>
<nav class="tabs" id="tabs"></nav>
<main id="main"></main>
</div>
</div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB = supabase.createClient("https://cwsxlfifpydxmmjsiwzg.supabase.co", "sb_publishable_2e3Qb6cB7J70m4d7JSCKlg_HVQNsOS7", { auth: { persistSession: true, autoRefreshToken: true, storageKey: "bear_cloud_auth" } });
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const FEATURES = { tasks: "待辦清單", schedule: "班表管理", lessons: "教案花園", training: "研習任務", calendar: "行事曆", chores: "例行公事", funds: "班級資金", supplies: "寶貝補給品", forms: "回條小幫手", students: "學生名冊", roster: "全園班表與代班", routine: "班級作息表", motor: "大肌肉活動", afterschool: "課後才藝", bus: "娃娃車名單", indicators: "幼兒學習指標", team: "班級共享（多位老師）", ai: "AI 小幫手" };
const AI_KINDS = { routine: "讀作息表照片", roster: "讀全園班表", bus: "讀娃娃車名單", motor: "讀大肌肉活動規劃", calendar: "讀行事曆", lesson: "推薦學習指標", lessonChat: "AI 寫教案（每一輪）" };
const AI_COST_NT = { routine: 1, roster: 1, bus: 1, motor: 1, calendar: 3, lesson: 0.8, lessonChat: 2 }; // measured average cost per task (NT$)
let D = null, U = null, tab = "home", q = "", usort = "cost";
function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("on"), 2600); }
const fd = (iso) => { if (!iso) return ""; const d = new Date(iso); return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`; };
const left = (iso) => Math.ceil((new Date(iso) - Date.now()) / 864e5);
function subTag(s, via) {
  if (!s) return `<span class="tag t-none">${via ? "跟隨建立者" : "沒有方案"}</span>`;
  const p = (D.plans || []).find((x) => x.id === s.plan_id), name = p ? p.name : s.plan_id, l = left(s.ends_at);
  const cls = l <= 0 ? "t-ro" : s.status === "trial" ? "t-trial" : "t-active";
  return `<span class="tag ${cls}">${esc(name)}</span><div class="muted">${l <= 0 ? "已到期（唯讀）" : l > 3650 ? "長期有效" : `到 ${fd(s.ends_at)}・剩 ${l} 天`}${s.seats ? `・${s.seats} 位` : ""}</div><div class="muted">AI 已用 ${s.ai_used}${s.ai_bonus ? `・加購剩 ${s.ai_bonus}` : ""}</div>`;
}
async function load() {
  const [{ data, error }, us] = await Promise.all([SB.rpc("admin_overview"), SB.rpc("admin_usage")]);
  if (error) { $("gate").hidden = false; $("gate").innerHTML = "讀取失敗：" + esc(error.message); return; }
  D = data; U = us.data || { by_user: {}, by_ws: {}, paid_user: {}, paid_ws: {}, total: {}, by_kind: {}, usd_twd: 32 }; render();
}
function render() {
  const pendN = D.payments.filter((p) => p.status === "pending").length;
  const T = [["home", "總覽"], ["pay", `付款紀錄${pendN ? `（待確認 ${pendN}）` : ""}`], ["usage", "用量與價格"], ["users", `老師（${D.users.length}）`], ["ws", `班級（${D.workspaces.length}）`], ["plans", "方案"], ["set", "設定"]];
  $("tabs").innerHTML = T.map(([k, n]) => `<button class="${tab === k ? "on" : ""}" data-t="${k}">${n}</button>`).join("");
  $("tabs").querySelectorAll("[data-t]").forEach((b) => b.onclick = () => { tab = b.dataset.t; q = ""; render(); });
  const m = $("main");
  if (tab === "home") m.innerHTML = homeHTML();
  if (tab === "users") m.innerHTML = usersHTML();
  if (tab === "usage") m.innerHTML = usageHTML();
  if (tab === "ws") m.innerHTML = wsHTML();
  if (tab === "plans") m.innerHTML = plansHTML();
  if (tab === "pay") m.innerHTML = payHTML();
  if (tab === "set") m.innerHTML = setHTML();
  bind();
}
const nt = (usd, d = 1) => { const v = Number(usd || 0) * (U?.usd_twd || 32); return "NT$" + (Math.abs(v) < 0.05 ? 0 : v).toLocaleString(undefined, { maximumFractionDigits: d, minimumFractionDigits: v && Math.abs(v) < 100 ? d : 0 }); };
function monthlyPrice(sub) { if (!sub || sub.status === "trial" || left(sub.ends_at) <= 0) return 0; const p = D.plans.find((x) => x.id === sub.plan_id); if (!p) return 0; const extra = sub.seats && sub.seats > p.seats ? (sub.seats - p.seats) * p.extra_seat_price : 0; return p.price_month + extra; }
function usageHTML() {
  const rate = U.usd_twd || 32, zero = { calls30: 0, points30: 0, cost30: 0, month_points: 0, month_cost: 0, calls_all: 0, cost_all: 0 };
  const wsRows = D.workspaces.map((w) => { const own = w.sub, os = D.users.find((u) => u.id === w.owner_id)?.sub, sub = own || os, u = U.by_ws[w.id] || zero, price = monthlyPrice(sub); return { id: w.id, type: "workspace", name: w.name, sub: "班級：" + (sub ? (D.plans.find((p) => p.id === sub.plan_id)?.name || sub.plan_id) : "沒有方案") + (own ? "" : "（跟隨建立者）"), state: sub, members: w.members, price, paid: U.paid_ws[w.id] || 0, u, margin: price - u.cost30 * rate }; });
  const userRows = D.users.map((x) => { const u = U.by_user[x.id] || zero, price = monthlyPrice(x.sub); return { id: x.id, type: "user", name: x.name || "（未命名）", sub: x.sub ? (D.plans.find((p) => p.id === x.sub.plan_id)?.name || x.sub.plan_id) : "沒有方案", state: x.sub, members: null, price, paid: U.paid_user[x.id] || 0, u, margin: price - u.cost30 * rate }; });
  const sorter = { cost: (a, b) => b.u.cost30 - a.u.cost30, margin: (a, b) => a.margin - b.margin, paid: (a, b) => b.paid - a.paid, name: (a, b) => a.name.localeCompare(b.name, "zh-Hant") }[usort];
  const head = `<tr><th>名稱</th><th>方案</th><th>月費</th><th>累計付款</th><th>本月 AI</th><th>近 30 天 AI</th><th>近 30 天成本</th><th>月費 − AI 成本</th><th></th></tr>`;
  const row = (r) => `<tr><td><b>${esc(r.name)}</b>${r.members != null ? `<div class="muted">${r.members} 位老師</div>` : ""}</td><td>${esc(r.sub)}<div class="muted">${r.state ? (left(r.state.ends_at) <= 0 ? "已到期" : r.state.status === "trial" ? "體驗中" : "到 " + fd(r.state.ends_at)) : ""}</div></td><td>${r.price ? "NT$" + r.price.toLocaleString() : '<span class="muted">—</span>'}</td><td>NT$${r.paid.toLocaleString()}</td><td>${r.u.month_points} 點<div class="muted">${nt(r.u.month_cost)}</div></td><td>${r.u.calls30} 次・${r.u.points30} 點</td><td>${nt(r.u.cost30)}</td><td style="color:${r.margin < 0 ? "var(--bad)" : "var(--sage)"};font-weight:700">${r.price || r.u.cost30 ? (r.margin < 0 ? "−" : "") + "NT$" + Math.abs(Math.round(r.margin)).toLocaleString() : "—"}</td><td><button class="btn o s" data-detail="${r.type}|${r.id}">明細</button></td></tr>`;
  const sortBtns = [["cost", "成本高的在前"], ["margin", "賠錢的在前"], ["paid", "付款多的在前"], ["name", "名稱"]].map(([k, n]) => `<button class="btn ${usort === k ? "" : "o"} s" data-usort="${k}">${n}</button>`).join("");
  return `<div class="acts" style="margin-bottom:10px">${sortBtns}</div><p class="muted" style="margin:0 0 8px">「月費」是目前方案每月的價格（含加購人數）；體驗中、已到期顯示 —。「月費 − AI 成本」是紅字的，代表 AI 用量已經超過月費。</p>
  <div class="card tw"><h3 style="margin:0 0 6px;font-size:15px">班級</h3><table><thead>${head}</thead><tbody>${wsRows.sort(sorter).map(row).join("")}</tbody></table>${wsRows.length ? "" : '<div class="empty">還沒有班級</div>'}</div>
  <div class="card tw"><h3 style="margin:0 0 6px;font-size:15px">老師（個人）</h3><table><thead>${head}</thead><tbody>${userRows.sort(sorter).map(row).join("")}</tbody></table></div>`;
}
async function detailDialog(type, id) {
  const { data, error } = await SB.rpc("admin_usage_detail", { p_type: type, p_id: id });
  if (error) return toast(error.message);
  const rows = data || [];
  $("dlgBody").innerHTML = `<h3>AI 使用明細・${esc(whoName(type, id))}</h3><p class="muted" style="margin:0 0 8px">最近 100 筆，只記錄做了什麼工作和花費，不記錄內容。</p><div class="tw" style="max-height:60vh;overflow:auto"><table style="min-width:460px"><thead><tr><th>時間</th><th>老師</th><th>工作</th><th>點數</th><th>成本</th></tr></thead><tbody>${rows.map((r) => `<tr><td class="muted">${new Date(r.at).toLocaleString("zh-TW", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })}</td><td>${esc(r.who)}${r.ws && type === "user" ? `<div class="muted">${esc(r.ws)}</div>` : ""}</td><td>${esc(AI_KINDS[r.kind] || (r.kind === "refund" ? "退回點數" : r.kind === "topup" ? "加購" : r.kind === "admin" ? "管理者調整" : r.kind))}</td><td>${r.points > 0 ? r.points : "+" + -r.points}</td><td>${r.cost != null ? nt(r.cost, 1) : '<span class="muted">—</span>'}</td></tr>`).join("")}</tbody></table>${rows.length ? "" : '<div class="empty">還沒有使用紀錄</div>'}</div><div class="acts" style="margin-top:12px;justify-content:flex-end"><button class="btn o" id="dlgNo">關閉</button></div>`;
  $("dlgNo").onclick = () => $("dlg").close();
  $("dlg").showModal();
}
function homeHTML() {
  const subs = [...D.users.map((u) => u.sub), ...D.workspaces.map((w) => w.sub)].filter(Boolean);
  const act = subs.filter((s) => left(s.ends_at) > 0 && s.status === "active").length, tri = subs.filter((s) => left(s.ends_at) > 0 && s.status === "trial").length, ro = subs.filter((s) => left(s.ends_at) <= 0).length;
  const since = Date.now() - 30 * 864e5, rev = D.payments.filter((p) => p.status === "paid" && new Date(p.created_at) > since).reduce((a, p) => a + p.amount, 0);
  const kinds = D.ai_by_kind_30d || {}, pts = Object.values(kinds).reduce((a, b) => a + b, 0);
  const estCost = (U.total?.cost30 || 0) * (U.usd_twd || 32);
  const soon = subs.filter((s) => { const l = left(s.ends_at); return l > 0 && l <= 7; });
  const pendN = D.payments.filter((p) => p.status === "pending").length;
  return `${pendN ? `<div class="card" style="border:2px solid #efc28a;display:flex;justify-content:space-between;align-items:center;gap:10px"><b>有 ${pendN} 筆付款通知等待確認</b><button class="btn s" data-t2="pay">去確認</button></div>` : ""}<div class="grid"><div class="stat"><small>老師帳號</small><b>${D.users.length}</b></div><div class="stat"><small>付費使用中</small><b>${act}</b></div><div class="stat"><small>免費體驗中</small><b>${tri}</b></div><div class="stat"><small>已到期（唯讀）</small><b>${ro}</b></div><div class="stat"><small>近 30 天收入</small><b>NT$${rev.toLocaleString()}</b></div><div class="stat"><small>近 30 天 AI 點數 / 實際成本</small><b>${pts} 點</b><div class="muted">${nt(U.total?.cost30 || 0)}（${U.total?.calls30 || 0} 次）</div></div><div class="stat"><small>近 30 天收入 − AI 成本</small><b>${rev - estCost < -0.5 ? "−" : ""}NT$${Math.abs(Math.round(rev - estCost)).toLocaleString()}</b><div class="muted">還沒扣主機、金流手續費</div></div></div>
  <div class="card" style="margin-top:12px"><h3 style="margin:0 0 8px;font-size:15px">7 天內到期</h3>${soon.length ? soon.map((s) => { const who = s.subject_type === "user" ? D.users.find((u) => u.id === s.subject_id)?.name : "班級 " + (D.workspaces.find((w) => w.id === s.subject_id)?.name || ""); return `<div class="kv"><span>${esc(who || s.subject_id)}</span><span>${fd(s.ends_at)}（剩 ${left(s.ends_at)} 天）</span></div>`; }).join("") : '<p class="muted">沒有</p>'}</div>
  <div class="card"><h3 style="margin:0 0 8px;font-size:15px">近 30 天 AI 用量</h3>${Object.keys(kinds).length ? Object.entries(kinds).map(([k, n]) => `<div class="kv"><span>${esc(AI_KINDS[k] || k)}</span><span>${n} 點</span></div>`).join("") : '<p class="muted">還沒有使用紀錄</p>'}${Object.keys(U.by_kind || {}).length ? `<div class="tw" style="margin-top:10px"><table style="min-width:420px"><thead><tr><th>AI 工作</th><th>次數</th><th>扣點</th><th>實際成本</th><th>平均每次</th></tr></thead><tbody>${Object.entries(U.by_kind).map(([k, v]) => `<tr><td>${esc(AI_KINDS[k] || k)}</td><td>${v.calls}</td><td>${v.points}</td><td>${nt(v.cost)}</td><td>${nt(v.avg, 1)}</td></tr>`).join("")}</tbody></table></div>` : ""}<p class="muted" style="margin-top:8px">成本依每次實際用量計算（換算匯率 1 美元 = ${U.usd_twd || 32} 元，可在「設定」修改），金額以 Anthropic 帳單為準。</p></div>`;
}
const match = (s) => !q || String(s).toLowerCase().includes(q.toLowerCase());
function usersHTML() {
  const list = D.users.filter((u) => match(u.name + " " + u.classes.map((c) => c.name).join(" ")));
  return `<input class="search" id="q" placeholder="搜尋老師或班級" value="${esc(q)}"><div class="card tw"><table><thead><tr><th>老師</th><th>註冊／最後登入</th><th>個人方案</th><th>班級</th><th>AI 30 天</th><th></th></tr></thead><tbody>${list.map((u) => `<tr><td><b>${esc(u.name || "（未命名）")}</b>${u.admin ? ' <span class="tag t-admin">管理員</span>' : ""}</td><td class="muted">${fd(u.created_at)}<br>${fd(u.last_sign_in)}</td><td>${subTag(u.sub)}</td><td>${u.classes.map((c) => `<div>${esc(c.name)} <span class="muted">${c.role === "owner" ? "建立者" : "成員"}${c.status === "pending" ? "・待核准" : ""}</span></div>`).join("") || '<span class="muted">—</span>'}</td><td>${u.ai_30d} 點</td><td><div class="acts"><button class="btn s" data-pay="user|${u.id}">記錄付款</button><button class="btn o s" data-sub="user|${u.id}">方案設定</button><button class="btn o s" data-pts="user|${u.id}">加點數</button><button class="btn o s" data-adm="${u.id}|${u.admin ? 0 : 1}">${u.admin ? "取消管理員" : "設為管理員"}</button></div></td></tr>`).join("")}</tbody></table>${list.length ? "" : '<div class="empty">沒有符合的老師</div>'}</div>`;
}

function bind() {

  document.querySelectorAll("[data-pts]").forEach((b) => b.onclick = () => ptsDialog(...b.dataset.pts.split("|")));

  document.querySelectorAll("[data-delplan]").forEach((b) => b.onclick = async () => { if (!confirm("確定刪除這個方案嗎？")) return; const { error } = await SB.rpc("admin_delete_plan", { p_id: b.dataset.delplan }); if (error) return toast(/plan_in_use/.test(error.message) ? "還有老師在用這個方案，不能刪除；可以取消「公開」讓新老師看不到" : error.message); toast("已刪除"); load(); });
  document.querySelectorAll("[data-newplan]").forEach((b) => b.onclick = () => { D.plans.push({ _new: true, id: "", name: "", description: "", price_month: 0, price_year: 0, seats: 1, extra_seat_price: 0, ai_points: 0, features: Object.fromEntries(Object.keys(FEATURES).map((k) => [k, true])), public: false, sort: D.plans.length + 1 }); render(); });

    if (k === "bank") { const code = $("bCode").value.trim(), acct = $("bAcct").value.trim(); if (code && !/^\d{3}$/.test(code)) return toast("銀行代碼是 3 碼數字"); key = "bank"; value = { bank_name: $("bName").value.trim(), bank_code: code, account: acct, holder: $("bHolder").value.trim() }; }

  });
}
function whoName(type, id) { return type === "user" ? (D.users.find((u) => u.id === id)?.name || "老師") : "班級「" + (D.workspaces.find((w) => w.id === id)?.name || "") + "」"; }

    <div class="row"><label class="f">到期日<input id="sEnds" type="date" value="${ends}"></label><label class="f">老師人數（空白＝方案預設）<input id="sSeats" type="number" min="1" value="${s.seats ?? ""}"></label></div><label class="f">備註<input id="sNote" value="${esc(s.note || "")}"></label>`, async () => {
    const plan = $("sPlan").value; if (!plan && !confirm(type === "workspace" ? "確定讓這個班級改成跟隨建立者的方案嗎？" : "確定移除這位老師的方案嗎？移除後會變成沒有方案。")) return false;
    const { error } = await SB.rpc("admin_set_sub", { p_type: type, p_id: id, p_plan: plan || null, p_status: $("sStatus").value, p_ends: $("sEnds").value ? new Date($("sEnds").value + "T23:59:59+08:00").toISOString() : null, p_seats: $("sSeats").value ? +$("sSeats").value : null, p_note: $("sNote").value.trim() });
    if (error) { toast("保存失敗：" + error.message); return false; }
    toast("已更新"); load();
  });
}
function ptsDialog(type, id) {
  openDlg(`<h3>調整 AI 點數・${esc(whoName(type, id))}</h3><p class="muted" style="margin:0 0 10px">加到「加購點數」，不會過期。填負數可以扣回。</p><div class="row"><label class="f">點數<input id="aPts" type="number" value="20"></label><label class="f">原因<input id="aNote" placeholder="例如：補償、贈送"></label></div>`, async () => {
    const { error } = await SB.rpc("admin_add_points", { p_type: type, p_id: id, p_points: +$("aPts").value || 0, p_note: $("aNote").value.trim() });
    if (error) { toast(/no subscription/.test(error.message) ? "這個對象還沒有方案，請先設定方案" : "失敗：" + error.message); return false; }
    toast("點數已更新"); load();
  });
}
// ---- LINE sign-in on this page (only admins ever see anything) ----
const LIFF_ID = "2012187193-uL27Ayag";
const notFound = () => { document.title = "404"; $("gate").innerHTML = '<div style="font-size:42px;font-weight:800;color:#c9b6a9">404</div><p>找不到這個頁面</p>'; };
async function liffReady() {
  if (!window.liff) await new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://static.line-scdn.net/liff/edge/2/sdk.js"; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  await liff.init({ liffId: LIFF_ID });
}
function tokenStale() { try { const d = liff.getDecodedIDToken(); return !d || !d.exp || d.exp * 1000 < Date.now() + 60e3; } catch { return true; } }
async function lineSignIn() {
  $("gate").innerHTML = "正在連到 LINE…";
  await liffReady();
  if (liff.isLoggedIn() && tokenStale()) { try { liff.logout(); } catch {} }
  if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.origin + location.pathname }); return false; }
  const r = await fetch("https://cwsxlfifpydxmmjsiwzg.supabase.co/functions/v1/line-auth", { method: "POST", headers: { "Content-Type": "application/json", apikey: "sb_publishable_2e3Qb6cB7J70m4d7JSCKlg_HVQNsOS7" }, body: JSON.stringify({ idToken: liff.getIDToken() }) });
  const b = await r.json().catch(() => ({}));
  if (!r.ok || !b.token_hash) throw new Error(b.error || "LINE 登入失敗");
  const { error } = await SB.auth.verifyOtp({ token_hash: b.token_hash, type: "magiclink" });
  if (error) throw error;
  history.replaceState(null, "", location.pathname);
  return true;
}
async function enter() {
  const { data: ok } = await SB.rpc("is_admin");
  if (!ok) return notFound();
  $("gate").hidden = true; $("head").hidden = false; $("app").hidden = false; load();
}
$("logout").onclick = async () => { await SB.auth.signOut(); try { if (window.liff && liff.isLoggedIn()) liff.logout(); } catch {} location.replace(location.pathname); };
(async () => {
  try {
    const back = /[?&](code|liffClientId|liff\.state)=/.test(location.search);
    let { data } = await SB.auth.getSession();
    if (!data.session && back) { if (await lineSignIn()) ({ data } = await SB.auth.getSession()); else return; }
    if (!data.session) {
      $("gate").innerHTML = '<p style="margin:0 0 14px">請先登入</p><button class="btn" id="lineBtn" style="background:#06C755">使用 LINE 登入</button>';
      $("lineBtn").onclick = () => lineSignIn().then((ok) => ok && enter()).catch((e) => { $("gate").textContent = "登入失敗：" + (e.message || e); });
      return;
    }
    await enter();
  } catch (e) { $("gate").textContent = "登入失敗：" + (e.message || e); }
})();
